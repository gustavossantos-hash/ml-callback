<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Callback Mercado Livre</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;background:#fff;color:#222}
  code{display:block;padding:12px;background:#f2f2f2;border-radius:6px;word-break:break-all;font-size:16px}
  button{margin-top:12px;padding:10px 16px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<h1>Autorização Mercado Livre</h1>
<div id="out"></div>
<script>
  const p = new URLSearchParams(location.search);
  const code = p.get('code'), erro = p.get('error');
  const out = document.getElementById('out');
  if (code) {
    out.innerHTML = '<p>Código recebido (expira em 10 minutos):</p><code id="c"></code><button id="b">Copiar código</button>';
    document.getElementById('c').textContent = code;
    document.getElementById('b').onclick = () => navigator.clipboard.writeText(code).then(() => b.textContent = 'Copiado!');
    history.replaceState(null, '', location.pathname);
  } else if (erro) {
    out.textContent = 'Erro: ' + erro + ' — ' + (p.get('error_description') || '');
  } else {
    out.textContent = 'Nenhum código na URL. Inicie a autorização pelo link do Mercado Livre.';
  }
</script>
</body>
</html>
